<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Typing Speed Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <div class="main-container">
    <h1>Typing Speed Test</h1>
    <div class="difficulty-select">
      <label for="difficulty">Choose difficulty:</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="new-challenge">New Challenge</button>
    </div>
    <div class="challenge-box">
      <p id="test-string">Press 'New Challenge' to begin!</p>
    </div>
    <textarea id="user-input" placeholder="Start typing here..." rows="4" disabled></textarea>
    <div class="controls">
      <button id="start-btn">Start</button>
      <button id="retry-btn" disabled>Retry</button>
    </div>
    <div id="results" class="hidden">
      <p>Total words: <span id="total-words"></span></p>
      <p>Time used: <span id="time-used"></span> seconds</p>
      <p>Your accuracy: <span id="accuracy"></span>%</p>
      <p>Speed: <span id="wpm"></span> words per minute</p>
    </div>
  </div>
  <script src="page.js"></script>
</body>
</html>
